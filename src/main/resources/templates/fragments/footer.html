<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 푸터 Fragment -->
<footer th:fragment="footer" class="footer">
    <div class="container">
        <div class="footer-content">
            <!-- About Section -->
            <div class="footer-section">
                <h5><i class="fas fa-palette"></i> CodeCanvas</h5>
                <p style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6;">
                    개발자들이 자신의 프로젝트를 공유하고<br>
                    서로 영감을 주고받는 공간입니다.
                </p>
                <div class="social-links">
                    <a href="#" title="GitHub"><i class="fab fa-github"></i></a>
                    <a href="#" title="Discord"><i class="fab fa-discord"></i></a>
                    <a href="#" title="Twitter"><i class="fab fa-twitter"></i></a>
                    <a href="#" title="YouTube"><i class="fab fa-youtube"></i></a>
                </div>
            </div>

            <!-- Quick Links -->
            <div class="footer-section">
                <h5>바로가기</h5>
                <ul>
                    <li><a th:href="@{/projects}">프로젝트 둘러보기</a></li>
                    <li><a th:href="@{/projects/new}">프로젝트 등록하기</a></li>
                    <li><a th:href="@{/board}">게시판</a></li>
                    <li><a th:href="@{/about}">소개</a></li>
                </ul>
            </div>

            <!-- Resources -->
            <div class="footer-section">
                <h5>리소스</h5>
                <ul>
                    <li><a href="#">개발 가이드</a></li>
                    <li><a href="#">API 문서</a></li>
                    <li><a href="#">커뮤니티 가이드라인</a></li>
                    <li><a href="#">FAQ</a></li>
                </ul>
            </div>

            <!-- Support -->
            <div class="footer-section">
                <h5>고객지원</h5>
                <ul>
                    <li><a th:href="@{/contact}">문의하기</a></li>
                    <li><a href="#">공지사항</a></li>
                    <li><a href="#">이용약관</a></li>
                    <li><a href="#">개인정보처리방침</a></li>
                </ul>
            </div>
        </div>

        <!-- Copyright -->
        <div class="footer-bottom">
            <p>&copy; 2025 CodeCanvas. All rights reserved.</p>
            <p style="margin-top: 0.5rem; font-size: 0.85rem;">
                Made with <i class="fas fa-heart" style="color: #ef4444;"></i> by Developers
            </p>
        </div>
    </div>
</footer>

<!-- Scripts Fragment -->
<th:block th:fragment="scripts">
    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script th:src="@{/js/main.js}"></script>
</th:block>
</body>
</html>
