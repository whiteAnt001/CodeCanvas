<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/header.css">
    <title>CodeCanvas - 개발자 커뮤니티</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .intro {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .intro h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .intro p {
            font-size: 16px;
            color: #666;
        }

        .posts {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .post-card {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .post-card:hover {
            transform: translateY(-5px);
        }

        .post-card h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .post-card p {
            font-size: 14px;
            color: #666;
        }

        footer {
            background-color: #1e1e2f;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
<div th:replace="include/header :: mainHeader"></div>

<div class="container">
    <section class="intro">
        <h2>개발자들의 무대, CodeCanvas</h2>
        <p>코드와 아이디어를 자유롭게 그려 나가는 공간입니다.</p>
    </section>

    <section class="posts">
        <div class="post-card">
            <h3>Spring Boot 질문 있어요</h3>
            <p>JPA 연관관계 매핑 관련해서 궁금한 점이 있습니다.</p>
        </div>
        <div class="post-card">
            <h3>프로젝트 공유</h3>
            <p>새로 만든 사이드 프로젝트를 소개합니다.</p>
        </div>
        <div class="post-card">
            <h3>백엔드 꿀팁</h3>
            <p>API 응답 속도 최적화 방법 정리</p>
        </div>
        <div class="post-card">
            <h3>프론트엔드 뉴스</h3>
            <p>최신 React 19 기능 소개</p>
        </div>
    </section>
</div>

<footer>
    &copy; 2025 CodeCanvas. All rights reserved.
</footer>
</body>
</html>
