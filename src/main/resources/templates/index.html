<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/header.css">
    <title>CodeCanvas - 개발자 커뮤니티</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .intro {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .intro h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .intro p {
            font-size: 16px;
            color: #666;
        }

        .posts {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 한 줄에 2개씩 */
            gap: 20px;
        }

        .post-card {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .post-card:hover {
            transform: translateY(-5px);
        }

        .post-card h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .post-card p {
            font-size: 14px;
            color: #666;
        }

        footer {
            background-color: #1e1e2f;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
        .board-section {
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    margin-bottom: 20px;
}

.board-section h2 {
    font-size: 22px;
    margin-bottom: 15px;
    color: #1e1e2f;
}

.board-section ul {
    list-style: none;
    padding: 0;
}

.board-section ul li {
    margin-bottom: 8px;
}

.board-section ul li a {
    text-decoration: none;
    color: #333;
    transition: color 0.2s;
}

.board-section ul li a:hover {
    color: #007bff;
}

    </style>
</head>
<body>
<div th:replace="include/header :: mainHeader"></div>

<div class="container">
    <section class="intro">
        <h2>개발자들의 무대, CodeCanvas</h2>
        <p>코드와 아이디어를 자유롭게 그려 나가는 공간입니다.</p>
    </section>

    <section class="posts">
        <!-- 게시판 1 -->
        <div class="board-section">
            <h2>📌 자유 게시판</h2>
            <ul>
                <li th:each="post : ${free}">
                    <a th:href="@{/board/{id}(id=${post.idx})}" th:text="${post.title}"></a>
                </li>
            </ul>
        </div>

        <!-- 게시판 2 -->
        <div class="board-section">
            <h2>📌 프로젝트 공유</h2>
            <ul>
                <li th:each="post : ${recruit}">
                    <a th:href="@{/board/{id}(id=${post.idx})}" th:text="${post.title}"></a>
                </li>
            </ul>
        </div>

        <!-- 게시판 3 -->
        <div class="board-section">
            <h2>📌 백엔드 게시판</h2>
            <ul>
                <li th:each="post : ${back}">
                    <a th:href="@{/board/{id}(id=${post.idx})}" th:text="${post.title}"></a>
                </li>
            </ul>
        </div>

        <!-- 게시판 4 -->
        <div class="board-section">
            <h2>📌 프론트엔드 게시판</h2>
            <ul>
                <li th:each="post : ${front}">
                    <a th:href="@{/board/{id}(id=${post.idx})}" th:text="${post.title}"></a>
                </li>
            </ul>
        </div>
    </section>

</div>

<footer>
    &copy; 2025 CodeCanvas. All rights reserved.
</footer>
</body>
</html>
