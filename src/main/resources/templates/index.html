<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
    <title>프로젝트 쇼케이스 - CodeCanvas</title>
</head>
<body>
<!-- 네비게이션 -->
<nav th:replace="~{fragments/header :: navbar}"></nav>

<!-- 헤더 섹션 -->
<div class="header-section">
    <div class="container">
        <h1><i class="fas fa-rocket"></i> 프로젝트 쇼케이스</h1>
        <p>개발자들의 멋진 프로젝트를 공유하고 영감을 받아보세요</p>
        <a th:href="@{/projects/new}" class="btn btn-new-project mt-3">
            <i class="fas fa-plus"></i> 새 프로젝트 등록
        </a>
    </div>
</div>

<!-- 메인 컨텐츠 -->
<div class="container pb-5" style="margin-top: 2rem;">
    <!-- 필터 섹션 -->
    <div class="filter-section">
        <div class="row g-3">
            <div class="col-md-6">
                <input type="text" class="form-control search-box" placeholder="프로젝트 검색...">
            </div>
            <div class="col-md-6">
                <div class="d-flex flex-wrap justify-content-md-end">
                    <button class="filter-btn active">전체</button>
                    <button class="filter-btn">웹</button>
                    <button class="filter-btn">모바일</button>
                    <button class="filter-btn">AI/ML</button>
                    <button class="filter-btn">게임</button>
                    <button class="filter-btn">기타</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 프로젝트 그리드 -->
    <div class="row g-4">
        <!-- 프로젝트 카드 (Thymeleaf 반복문) -->
        <div class="col-md-6 col-lg-4" th:each="project : ${projects}">
            <div class="project-card" th:data-project-id="${project.id}">
                <img th:src="${project.thumbnailUrl != null ? project.thumbnailUrl : 'https://via.placeholder.com/400x200/e5e7eb/6b7280?text=Project+Image'}"
                     class="project-thumbnail"
                     th:alt="${project.title}">
                <div class="project-content">
                    <h3 class="project-title" th:text="${project.title}">프로젝트 제목</h3>
                    <p class="project-description" th:text="${project.description}">
                        프로젝트 설명이 여기에 표시됩니다.
                    </p>
                    <div class="tech-tags">
                            <span class="tech-tag" th:each="tech : ${project.techStack}" th:text="${tech}">
                                기술스택
                            </span>
                    </div>
                    <div class="project-meta">
                        <div class="author-info">
                            <div class="author-avatar"
                                 th:style="${project.author.avatarUrl != null ? 'background-image: url(' + project.author.avatarUrl + '); background-size: cover;' : ''}">
                            </div>
                            <span class="author-name" th:text="${project.author.username}">작성자</span>
                        </div>
                        <div class="project-stats">
                                <span class="stat-item">
                                    <i class="fas fa-heart"></i>
                                    <span th:text="${project.likeCount}">0</span>
                                </span>
                            <span class="stat-item">
                                    <i class="fas fa-eye"></i>
                                    <span th:text="${project.viewCount}">0</span>
                                </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 프로젝트가 없을 때 -->
        <div class="col-12" th:if="${#lists.isEmpty(projects)}">
            <div class="text-center" style="padding: 4rem 0;">
                <i class="fas fa-inbox" style="font-size: 4rem; color: var(--text-secondary); margin-bottom: 1rem;"></i>
                <h3 style="color: var(--text-secondary);">등록된 프로젝트가 없습니다</h3>
                <p style="color: var(--text-secondary); margin-bottom: 2rem;">
                    첫 번째 프로젝트를 등록해보세요!
                </p>
                <a th:href="@{/projects/new}" class="btn btn-new-project">
                    <i class="fas fa-plus"></i> 프로젝트 등록하기
                </a>
            </div>
        </div>
    </div>

    <!-- 페이지네이션 -->
    <nav class="mt-5" th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
            <!-- 이전 버튼 -->
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/projects(page=${currentPage - 1})}"
                   th:if="${currentPage > 0}">이전</a>
                <span class="page-link" th:if="${currentPage == 0}">이전</span>
            </li>

            <!-- 페이지 번호 -->
            <li class="page-item"
                th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${pageNum == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/projects(page=${pageNum})}"
                   th:text="${pageNum + 1}">1</a>
            </li>

            <!-- 다음 버튼 -->
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/projects(page=${currentPage + 1})}"
                   th:if="${currentPage < totalPages - 1}">다음</a>
                <span class="page-link" th:if="${currentPage == totalPages - 1}">다음</span>
            </li>
        </ul>
    </nav>
</div>

<!-- 푸터 -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<!-- Scripts -->
<th:block th:replace="~{fragments/footer :: scripts}"></th:block>
</body>
</html>
