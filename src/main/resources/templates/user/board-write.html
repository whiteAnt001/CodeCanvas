<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeCanvas - 새 글 작성</title>
    <style>
        *{box-sizing:border-box}
        body{font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f6f7fb; color:#222; margin:0}
        .container{max-width:1000px;margin:40px auto;padding:20px}
        .card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 6px 18px rgba(15,23,42,0.06)}
        h1{font-size:22px;margin-bottom:8px}
        .form-row{margin-bottom:14px}
        label{display:block;font-weight:600;margin-bottom:6px}
        input[type=text], textarea, select{width:100%;padding:10px;border:1px solid #e3e6ea;border-radius:8px;font-size:14px}
        textarea{min-height:180px;resize:vertical}
        input[type=file]{display:none}
        .file-label{display:inline-block;padding:10px 14px;border-radius:8px;background:#1e1e2f;color:#fff;cursor:pointer; font-size:14px}
        .flex{display:flex;gap:12px;align-items:center}
        .btn{display:inline-block;padding:10px 14px;border-radius:8px;text-decoration:none;border:0;cursor:pointer}
        .btn-primary{background:#1e1e2f;color:#fff}
        .btn-ghost{background:transparent;border:1px solid #d6dbe3;color:#1e1e2f}
    </style>
    <link rel="stylesheet" href="/css/header.css">
</head>
<body>
<div th:replace="include/header :: mainHeader"></div>
<main class="container">
    <div class="card">
        <h1>새 게시글 작성</h1>
        <form action="/api/board/write" method="post" enctype="multipart/form-data">
            <div class="form-row">
                <label for="board">게시판 선택</label>
                <select id="board" name="board">
                    <option value="FREE">자유게시판</option>
                    <option value="QNA">질문</option>
                    <option value="RECRUIT">프로젝트 구인/구직</option>
                </select>
            </div>
            <div class="form-row">
                <label for="title">제목</label>
                <input type="text" id="title" name="title" placeholder="게시글 제목을 입력하세요" />
            </div>

            <div class="form-row">
                <label for="content">내용</label>
                <textarea id="content" name="content" placeholder="내용을 입력하세요"></textarea>
            </div>

            <div class="form-row">
                <label for="images">이미지 첨부</label>
                <label for="images" class="file-label">파일 선택</label>
                <input type="file" id="images" name="files" multiple />
            </div>

            <div class="form-row flex">
                <button type="submit" class="btn btn-primary">등록</button>
                <button type="button" class="btn btn-ghost">취소</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
