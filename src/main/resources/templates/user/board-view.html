<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeCanvas - 게시글 보기</title>
    <link rel="stylesheet" href="/css/board.css">
    <link rel="stylesheet" href="/css/header.css">
</head>
<body>
<div th:replace="include/header :: mainHeader"></div>
<main class="container">
    <div class="card">
        <!-- 제목 -->
        <h1 th:text="${board.title}">게시글 제목</h1>

        <!-- 작성자 / 작성일 -->
        <div class="meta">
            <span th:text="${board.writerName}">작성자</span> ·
            <span th:text="${#temporals.format(board.regDate, 'yyyy-MM-dd HH:mm')}">2025-09-22</span>
        </div>

        <!-- 본문 -->
        <div class="content" th:text="${board.content}">
            게시글 내용이 여기에 표시됩니다.
        </div>

        <!-- 첨부파일 -->
        <div class="attachments" th:if="${board.image_name != null}">
            <img th:src="@{'/uploads/' + ${board.image_name}}" alt="첨부이미지" style="max-width:300px;"/>
        </div>


        <!-- 버튼 -->
        <div class="btns">
            <a th:href="@{'/board/edit/' + ${board.idx}}" class="btn btn-primary">수정</a>
            <a th:href="@{'/board/delete/' + ${board.idx}}" class="btn btn-ghost">삭제</a>
            <a th:href="@{'/board/list'}" class="btn btn-ghost">목록</a>
        </div>
    </div>
</main>
</body>
</html>
