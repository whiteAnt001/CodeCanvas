<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCanvas - 회원가입</title>
    <style>
        * { box-sizing: border-box; }
        body {
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background: #f6f7fb;
          margin: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
        }
        .container {
          background: #fff;
          padding: 30px;
          border-radius: 12px;
          box-shadow: 0 6px 18px rgba(0,0,0,0.1);
          width: 400px;
        }
        h2 {
          margin-bottom: 20px;
          text-align: center;
          color: #333;
        }
        .form-group {
          margin-bottom: 15px;
        }
        .form-group label {
          display: block;
          margin-bottom: 6px;
          font-size: 14px;
          color: #555;
        }
        .form-group input {
          width: 100%;
          padding: 10px;
          border-radius: 6px;
          border: 1px solid #ddd;
        }
        button {
          width: 100%;
          padding: 12px;
          border: none;
          border-radius: 6px;
          background: #1cc88a;
          color: white;
          font-weight: bold;
          cursor: pointer;
          margin-top: 10px;
        }
        button:hover {
          background: #17a673;
        }
        .extra {
          margin-top: 15px;
          font-size: 14px;
          text-align: center;
        }
        .extra a {
          color: #1cc88a;
          text-decoration: none;
        }
        .extra a:hover {
          text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>회원가입</h2>
    <form th:action="@{/join}" method="post">
        <div class="form-group">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" required/>
        </div>
        <div class="form-group">
            <label for="username">닉네임</label>
            <input type="text" id="username" name="username" required/>
            <button type="button" id="checkBtn">중복 확인</button>
            <span id="checkResult"></span>
        </div>
        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" required/>
        </div>
        <div class="form-group">
            <label for="confirm">비밀번호 확인</label>
            <input type="password" id="confirm" name="confirm" required/>
        </div>
        <button type="submit">회원가입</button>
        <div class="extra">
            이미 회원이신가요? <a th:href="@{/login}">로그인</a>
        </div>
    </form>
</div>
</body>
<!-- 닉네임 중복 체크 -->
<script>
    document.getElementById('checkBtn').addEventListener('click', function() {
        const username = document.getElementById('username').value;
        fetch(`/api/user/check-username?username=${username}`)
            .then(res => res.json())
            .then(isTaken => {
                document.getElementById('checkResult').textContent =
                    isTaken ? "이미 사용중인 닉네임입니다." : "사용 가능한 닉네임입니다.";
            });
    });
</script>
</html>
